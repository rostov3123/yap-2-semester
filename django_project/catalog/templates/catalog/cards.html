<section class="grid" aria-label="Курсы">{% for course in courses %}<article class="card"><span class="badge">{{ course.level }} · {{ course.hours }} ч</span><h3>{{ course.title }}</h3><p>{{ course.description }}</p><div class="actions"><a href="{% url 'catalog:course_detail' course.id %}">Подробнее →</a></div></article>{% empty %}<p class="empty">Курсов пока нет.</p>{% endfor %}</section>
