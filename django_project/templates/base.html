<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Каталог курсов{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 24px; line-height: 1.5; }
        header, footer { background: #f2f5f8; padding: 16px; border-radius: 8px; }
        nav a { margin-right: 12px; }
        article { border-bottom: 1px solid #ddd; padding: 12px 0; }
        form p { display: grid; max-width: 520px; }
    </style>
</head>
<body>
<header>
    <h1>Каталог курсов</h1>
    <nav>
        <a href="{% url 'index' %}">Главная</a>
        <a href="{% url 'courses' %}">Курсы</a>
        <a href="{% url 'authors' %}">Авторы</a>
        <a href="{% url 'teacher_list' %}">Преподаватели</a>
        <a href="{% url 'course_list' %}">Schedule</a>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Профиль</a>
            <a href="{% url 'password_change' %}">Сменить пароль</a>
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Учебный проект по Django MVT</footer>
</body>
</html>
